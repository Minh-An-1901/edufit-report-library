<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện báo cáo - KPIMATRIX Edufit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    /* ============================================================
       1. DESIGN TOKENS & DUAL-THEME ENGINE (LIGHT & DARK MODE - BN-01)
       ============================================================ */
    :root {
      /* Base Colors - Light Theme */
      --body-bg: #f8fafc;
      --surface-bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-hover: #cbd5e1;
      
      --sidebar-bg: #0b1329;
      --sidebar-hover: rgba(255, 255, 255, 0.07);
      --sidebar-active-bg: rgba(79, 70, 229, 0.28);
      --sidebar-active-border: rgba(129, 140, 248, 0.4);
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #ffffff;
      
      --toolbar-bg: rgba(255, 255, 255, 0.85);
      --toolbar-border: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.09), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* Base Colors - Dark Theme (BN-01) */
      --body-bg: #070d1e;
      --surface-bg: #0f172a;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-border-hover: #334155;
      
      --sidebar-bg: #040814;
      --sidebar-hover: rgba(255, 255, 255, 0.05);
      --sidebar-active-bg: rgba(99, 102, 241, 0.22);
      --sidebar-active-border: rgba(99, 102, 241, 0.4);
      --sidebar-text: #64748b;
      --sidebar-text-active: #f8fafc;
      
      --toolbar-bg: rgba(11, 19, 41, 0.85);
      --toolbar-border: #1e293b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--body-bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 14px;
      transition: background-color var(--transition-smooth), color var(--transition-smooth);
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; outline: none; }

    button:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================================
       2. SIDEBAR CỐ ĐỊNH BÊN TRÁI (FR-01)
       ============================================================ */
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      transition: var(--transition-smooth);
    }

    .brand-logo {
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .logo-cube {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .logo-cube::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo-cube svg { width: 22px; height: 22px; fill: #ffffff; }

    .logo-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .logo-text .kpi { color: #ffffff; }
    .logo-text .matrix { color: #60a5fa; }

    .nav-list {
      list-style: none;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      color: var(--sidebar-text);
      font-weight: 600;
      font-size: 13.5px;
      transition: var(--transition-fast);
      text-align: left;
      position: relative;
    }

    .nav-item button:hover {
      background-color: var(--sidebar-hover);
      color: #ffffff;
      transform: translateX(2px);
    }

    .nav-item.active button {
      background-color: var(--sidebar-active-bg);
      border: 1px solid var(--sidebar-active-border);
      color: var(--sidebar-text-active);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .nav-item button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
      transition: var(--transition-fast);
    }

    .nav-item.active button svg {
      opacity: 1;
      stroke: #818cf8;
      filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.6));
    }

    /* Phân quyền giả định (Mock Role Selector - BN-01) */
    .role-selector-card {
      padding: 14px 16px;
      margin: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .role-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .role-select option { background: #0b1329; color: #ffffff; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-menu-btn { display: none; padding: 8px; border-radius: var(--radius-sm); color: var(--text-main); }

    /* ============================================================
       3. TOP TOOLBAR & CONTROLS (FR-02)
       ============================================================ */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--body-bg);
      transition: background-color var(--transition-smooth);
    }

    .toolbar {
      background-color: var(--toolbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 90;
      flex-wrap: wrap;
      transition: border-color var(--transition-smooth);
    }

    .page-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Tag Pills (FR-03) */
    .tags-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 700;
      border: 1.5px solid transparent;
      transition: var(--transition-fast);
      cursor: pointer;
      user-select: none;
    }

    .tag-pill svg { width: 13px; height: 13px; }

    /* Tag styles per group */
    .tag-pill[data-group="TDS"] { color: #4f46e5; background: rgba(79, 70, 229, 0.08); border-color: rgba(79, 70, 229, 0.25); }
    .tag-pill[data-group="TDS"].active { background: #4f46e5; color: #ffffff; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); }

    .tag-pill[data-group="SKR"] { color: #e0527a; background: rgba(224, 82, 122, 0.08); border-color: rgba(224, 82, 122, 0.25); }
    .tag-pill[data-group="SKR"].active { background: #e0527a; color: #ffffff; border-color: #e0527a; box-shadow: 0 4px 12px rgba(224, 82, 122, 0.35); }

    .tag-pill[data-group="ASC"] { color: #f0842c; background: rgba(240, 132, 44, 0.08); border-color: rgba(240, 132, 44, 0.25); }
    .tag-pill[data-group="ASC"].active { background: #f0842c; color: #ffffff; border-color: #f0842c; box-shadow: 0 4px 12px rgba(240, 132, 44, 0.35); }

    .tag-pill[data-group="TN"] { color: #22a06b; background: rgba(34, 160, 107, 0.08); border-color: rgba(34, 160, 107, 0.25); }
    .tag-pill[data-group="TN"].active { background: #22a06b; color: #ffffff; border-color: #22a06b; box-shadow: 0 4px 12px rgba(34, 160, 107, 0.35); }

    .tag-pill:hover { transform: translateY(-1px); }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background-color: var(--toolbar-border);
      margin: 0 4px;
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Ô tìm kiếm thông minh có Hotkey badge (FR-06, UI-03) */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      color: var(--text-light);
      pointer-events: none;
    }

    .search-input {
      padding: 7px 58px 7px 34px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background-color: var(--body-bg);
      font-size: 13px;
      width: 220px;
      font-family: inherit;
      color: var(--text-main);
      transition: var(--transition-fast);
    }

    .search-input:focus {
      background-color: var(--surface-bg);
      border-color: var(--primary);
      width: 260px;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .hotkey-badge {
      position: absolute;
      right: 28px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 5px;
      background: var(--card-border);
      color: var(--text-muted);
      border-radius: 4px;
      pointer-events: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 8px;
      color: var(--text-light);
      display: none;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }
    .clear-search-btn:hover { color: var(--text-main); }

    /* Dropdown Sắp xếp (BN-01) */
    .sort-select {
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .sort-select:hover { border-color: var(--primary); }

    /* View Switcher (FR-07) */
    .view-switcher {
      display: flex;
      align-items: center;
      background-color: var(--body-bg);
      border-radius: var(--radius-md);
      padding: 3px;
      border: 1px solid var(--card-border);
    }

    .view-btn {
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }

    .view-btn.active {
      background-color: var(--surface-bg);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .view-btn svg { width: 15px; height: 15px; }

    /* Dark Mode Toggle Button (BN-01) */
    .theme-toggle-btn {
      padding: 7px;
      border-radius: var(--radius-full);
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }
    .theme-toggle-btn:hover {
      background-color: var(--card-border);
      transform: rotate(15deg);
    }
    .theme-toggle-btn svg { width: 16px; height: 16px; }

    /* Simulator Dropdown (FR-09) */
    .simulator-wrapper { position: relative; }
    .sim-toggle-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(59, 130, 246, 0.1));
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.25);
    }
    .sim-toggle-btn:hover { background: rgba(79, 70, 229, 0.15); }

    .sim-menu {
      position: absolute;
      right: 0;
      top: 120%;
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-lg);
      width: 220px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }
    .sim-menu.show { display: flex; }
    .sim-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-main); }
    .sim-item input[type="checkbox"] { cursor: pointer; accent-color: var(--primary); }

    /* ============================================================
       4. MAIN CONTENT & CARDS (FR-04, FR-05)
       ============================================================ */
    .content-area {
      padding: 26px 28px;
      flex: 1;
    }

    .group-section {
      margin-bottom: 34px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .group-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 10px currentColor;
    }

    .group-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .group-badge {
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      background-color: rgba(79, 70, 229, 0.1);
      color: var(--primary);
    }

    /* CARDS GRID (FR-05) */
    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
    }

    .report-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition-fast);
      cursor: pointer;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .report-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: var(--card-border-hover);
    }

    /* PROCEDURAL ABSTRACT DATA ART THUMBNAILS (FR-05 - Nâng cấp) */
    .card-thumbnail {
      width: 100%;
      height: 135px;
      background: var(--body-bg);
      border-bottom: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    .card-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-tag {
      align-self: flex-start;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 14.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.35;
      margin-top: 2px;
    }

    .card-subtitle {
      font-size: 12.5px;
      color: var(--text-light);
      margin-top: auto;
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-date {
      font-size: 11.5px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* LIST VIEW (FR-07) */
    .reports-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .report-list-item {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition-fast);
      cursor: pointer;
    }

    .report-list-item:hover {
      transform: translateX(4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .list-thumbnail {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--card-border);
    }

    .list-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .list-title { font-size: 14.5px; font-weight: 700; color: var(--text-main); }
    .list-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }
    .list-action-btn { font-size: 13px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 4px; }

    /* ============================================================
       5. TRANG CHI TIẾT BÁO CÁO (FR-08) & BI DASHBOARD MÔ PHỎNG
       ============================================================ */
    .detail-view { display: flex; flex-direction: column; gap: 18px; animation: fadeIn 0.25s ease-out; }
    
    .detail-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-weight: 700;
      color: var(--text-main);
      font-size: 13px;
      transition: var(--transition-fast);
    }
    .back-btn:hover { background-color: var(--body-bg); border-color: var(--primary); color: var(--primary); }

    .copy-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition-fast);
    }
    .copy-link-btn:hover { border-color: var(--primary); color: var(--primary); }

    .detail-header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .detail-title { font-size: 21px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .detail-meta-row { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }

    .detail-embed-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
    }

    .embed-toolbar {
      background: var(--body-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .embed-url-display {
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface-bg);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      color: #3b82f6;
    }

    .embed-frame-wrapper {
      height: 540px;
      position: relative;
      background: var(--body-bg);
      display: flex;
      flex-direction: column;
    }

    /* MÔ PHỎNG BI DASHBOARD CÓ TƯƠNG TÁC */
    .mock-bi-dashboard {
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .mock-bi-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mock-kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .mock-kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .mock-kpi-val { font-size: 22px; font-weight: 800; color: var(--text-main); margin-top: 4px; }
    .mock-kpi-trend { font-size: 12px; color: #16a34a; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

    .mock-bi-chart-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .mock-chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 18px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .mock-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .mock-chart-title { font-size: 13.5px; font-weight: 700; color: var(--text-main); }
    .mock-time-pill {
      font-size: 11px;
      padding: 3px 8px;
      background: var(--body-bg);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    /* ============================================================
       6. TRẠNG THÁI: LOADING SKELETON, EMPTY, ERROR, 404 (FR-09)
       ============================================================ */
    .state-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 50px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .state-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--body-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .state-icon svg { width: 28px; height: 28px; }
    .state-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .state-desc { font-size: 13.5px; color: var(--text-muted); max-width: 440px; }

    .state-btn {
      padding: 8px 20px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      margin-top: 6px;
      transition: var(--transition-fast);
    }
    .state-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite;
      background: linear-gradient(90deg, var(--card-border) 25%, var(--body-bg) 50%, var(--card-border) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-sm);
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* TOAST NOTIFICATION */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-message {
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.25s ease-out forwards;
      pointer-events: auto;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       7. RESPONSIVE DESIGN (UI-02: 768px, 360px)
       ============================================================ */
    @media (max-width: 1024px) {
      .mock-bi-kpis { grid-template-columns: repeat(2, 1fr); }
      .mock-bi-chart-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .brand-logo { justify-content: space-between; }
      .nav-list { display: none; }
      .nav-list.open { display: flex; }
      .mobile-menu-btn { display: block; }
      .toolbar { padding: 12px 16px; gap: 10px; }
      .toolbar-right { margin-left: 0; width: 100%; justify-content: space-between; }
      .search-input { width: 100% !important; }
      .search-box { flex: 1; }
      .content-area { padding: 16px; }
      .reports-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .tags-container { width: 100%; overflow-x: auto; padding-bottom: 4px; }
      .page-title { width: 100%; }
      .mock-bi-kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <!-- ============================================================
       C. LOGIC JAVASCRIPT GỌN NHẸ & HIỆU NĂNG CAO
       ============================================================ -->
  <script>
    const APP_DATA = {{ initial_data | tojson | safe }};

    // -------------------------------------------------------------
    // 1. STATE MANAGEMENT TẬP TRUNG (EX-05)
    // -------------------------------------------------------------
    const state = {
      groups: APP_DATA.groups || [],
      menus: APP_DATA.menus || [],
      reports: APP_DATA.reports || [],
      
      currentPath: window.location.pathname || '/thu-vien-bao-cao',
      selectedGroup: null, 
      searchQuery: '',     
      viewMode: localStorage.getItem('kpi_view_mode') || 'grid',
      currentTheme: localStorage.getItem('kpi_theme') || 'light',
      sortBy: 'date-desc', // 'date-desc', 'date-asc', 'name-asc'
      userRole: 'ALL',     // 'ALL', 'TDS', 'SKR', 'ASC', 'TN' (Mock RBAC)
      
      // Trạng thái FR-09
      simulateDelay: false,
      simulateError: false,
      isLoading: false,
      hasError: false
    };

    // -------------------------------------------------------------
    // 2. UTILS: CHUẨN HÓA TIẾNG VIỆT & SINH ẢNH THUMBNAIL CAO CẤP
    // -------------------------------------------------------------
    function normalizeVietnamese(text) {
      if (!text) return '';
      return text
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[đĐ]/g, m => m === 'đ' ? 'd' : 'D')
        .toLowerCase()
        .trim();
    }

    function parseDate(dStr) {
      if (!dStr) return 0;
      const parts = dStr.split('/');
      if (parts.length === 3) {
        return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime();
      }
      return 0;
    }

    // Sinh đồ họa Abstract Data Art SVG dựa theo Seed & Color (FR-05)
    function generateThumbnailSvg(color, seed) {
      const s = Number(seed) || 1;
      const isDark = state.currentTheme === 'dark';
      const bg = isDark ? '#0b1329' : '#ffffff';
      const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)';
      const pattern = s % 4;
      
      let shapes = '';
      if (pattern === 3 || pattern === 0) {
        // Kiểu 1: Mảng khối cân đối hiện đại (như thẻ R01)
        shapes = `
          <rect x="0" y="0" width="85" height="95" fill="${color}" opacity="0.95"/>
          <rect x="155" y="75" width="85" height="60" fill="${color}" opacity="0.9"/>
          <rect x="240" y="0" width="120" height="95" fill="${color}" opacity="0.95"/>
          <circle cx="210" cy="35" r="4" fill="${color}" opacity="0.5"/>
          <circle cx="120" cy="115" r="4" fill="${color}" opacity="0.5"/>
        `;
      } else if (pattern === 1) {
        // Kiểu 2: Dải khối góc và thanh ngang đáy (như thẻ R02)
        shapes = `
          <rect x="130" y="0" width="85" height="28" fill="${color}" opacity="0.95"/>
          <rect x="285" y="24" width="75" height="90" fill="${color}" opacity="0.95"/>
          <rect x="130" y="105" width="85" height="30" fill="${color}" opacity="0.95"/>
          <line x1="30" y1="40" x2="100" y2="40" stroke="${color}" stroke-width="3" stroke-dasharray="4" opacity="0.5"/>
          <line x1="30" y1="55" x2="80" y2="55" stroke="${color}" stroke-width="3" opacity="0.3"/>
        `;
      } else if (pattern === 2) {
        // Kiểu 3: Khối tâm điểm sắc nét (như thẻ R03)
        shapes = `
          <rect x="0" y="0" width="360" height="135" fill="${color}" opacity="0.92"/>
          <rect x="80" y="20" width="180" height="95" fill="${bg}" rx="3"/>
          <rect x="105" y="45" width="45" height="45" fill="${color}" opacity="0.25" rx="2"/>
          <circle cx="205" cy="65" r="14" fill="${color}" opacity="0.3"/>
        `;
      }

      return `
        <svg viewBox="0 0 360 135" width="100%" height="100%" preserveAspectRatio="none" style="display:block;">
          <rect width="360" height="135" fill="${bg}"/>
          <!-- Grid lines -->
          <line x1="0" y1="45" x2="360" y2="45" stroke="${gridColor}" stroke-width="1"/>
          <line x1="0" y1="90" x2="360" y2="90" stroke="${gridColor}" stroke-width="1"/>
          <line x1="120" y1="0" x2="120" y2="135" stroke="${gridColor}" stroke-width="1"/>
          <line x1="240" y1="0" x2="240" y2="135" stroke="${gridColor}" stroke-width="1"/>
          ${shapes}
        </svg>
      `;
    }

    function getMenuIconSvg(iconName) {
      switch (iconName) {
        case 'pie-chart':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83M22 12A10 10 0 0 0 12 2v10z"/></svg>`;
        case 'table':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`;
        case 'scan':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2M8 12h8M12 8v8"/></svg>`;
        case 'id-badge':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>`;
        case 'graduation-cap':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg>`;
        default:
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
      }
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.innerHTML = `<span>⚡</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // -------------------------------------------------------------
    // 3. LOGIC LỌC, PHÂN QUYỀN VÀ SẮP XẾP BÁO CÁO (EX-03, BN-01)
    // -------------------------------------------------------------
    function getFilteredAndSortedReports() {
      let list = [...state.reports];

      // 1. Phân quyền giả định (Mock Role Filter - BN-01)
      if (state.userRole !== 'ALL') {
        list = list.filter(r => r.group.toUpperCase() === state.userRole.toUpperCase());
      }

      // 2. Lọc theo nhãn nhóm người dùng chọn (FR-03)
      if (state.selectedGroup) {
        list = list.filter(r => r.group.toUpperCase() === state.selectedGroup.toUpperCase());
      }

      // 3. Tìm theo tên tiếng Việt không dấu (FR-06)
      if (state.searchQuery) {
        const q = normalizeVietnamese(state.searchQuery);
        list = list.filter(r => normalizeVietnamese(r.title).includes(q));
      }

      // 4. Sắp xếp (Sort - BN-01)
      if (state.sortBy === 'date-desc') {
        list.sort((a, b) => parseDate(b.updated_at) - parseDate(a.updated_at));
      } else if (state.sortBy === 'date-asc') {
        list.sort((a, b) => parseDate(a.updated_at) - parseDate(b.updated_at));
      } else if (state.sortBy === 'name-asc') {
        list.sort((a, b) => a.title.localeCompare(b.title, 'vi'));
      }

      return list;
    }

    // -------------------------------------------------------------
    // 4. RENDER GIAO DIỆN
    // -------------------------------------------------------------
    function renderSidebar() {
      const navList = document.getElementById('sidebarNav');
      if (!navList) return;

      navList.innerHTML = state.menus.map(item => {
        const isActive = state.currentPath.startsWith(item.path);
        return `
          <li class="nav-item ${isActive ? 'active' : ''}">
            <button onclick="navigate('${item.path}')">
              ${getMenuIconSvg(item.icon)}
              <span>${item.title}</span>
            </button>
          </li>
        `;
      }).join('');
    }

    function renderGroupTags() {
      const container = document.getElementById('groupTagsContainer');
      if (!container) return;

      container.innerHTML = state.groups.map(g => {
        const isSelected = state.selectedGroup === g.id;
        // Nếu userRole đang giới hạn nhóm khác thì làm mờ tag này
        const isRestricted = state.userRole !== 'ALL' && state.userRole !== g.id;
        const opacityStyle = isRestricted ? 'opacity: 0.35; pointer-events: none;' : '';

        return `
          <button class="tag-pill ${isSelected ? 'active' : ''}" 
                  data-group="${g.id}" 
                  style="${opacityStyle}"
                  onclick="toggleGroupFilter('${g.id}')">
            <svg fill="currentColor" viewBox="0 0 16 16"><path d="M2 2a1 1 0 0 1 1-1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 2 6.586V2zm3.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
            <span>${g.name}</span>
          </button>
        `;
      }).join('');
    }

    function renderContent() {
      const content = document.getElementById('mainContent');
      if (!content) return;

      // 1. Loading Skeleton (FR-09)
      if (state.isLoading) {
        content.innerHTML = `
          <div class="reports-grid">
            ${Array(6).fill(0).map(() => `
              <div class="report-card" style="pointer-events:none;">
                <div class="card-thumbnail skeleton"></div>
                <div class="card-body">
                  <div class="skeleton" style="width: 50px; height: 16px; margin-bottom: 8px;"></div>
                  <div class="skeleton" style="width: 80%; height: 20px; margin-bottom: 12px;"></div>
                  <div class="skeleton" style="width: 40%; height: 14px;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      // 2. Error State (FR-09)
      if (state.hasError) {
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon" style="color:#ef4444; background:#fef2f2;">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            </div>
            <div class="state-title">Không thể tải dữ liệu báo cáo</div>
            <div class="state-desc">Đã xảy ra lỗi khi kết nối tới máy chủ API. Vui lòng bấm Thử lại để tải lại dữ liệu.</div>
            <button class="state-btn" onclick="retryFetchData()">Thử lại</button>
          </div>
        `;
        return;
      }

      // 3. Chi tiết báo cáo (/thu-vien-bao-cao/R01) (FR-08)
      const detailMatch = state.currentPath.match(/^\/thu-vien-bao-cao\/([^\/]+)$/);
      if (detailMatch) {
        renderDetailView(detailMatch[1]);
        return;
      }

      // 4. Các trang menu khác (FR-10)
      if (state.currentPath !== '/thu-vien-bao-cao' && state.currentPath !== '/') {
        const activeMenu = state.menus.find(m => m.path === state.currentPath);
        const title = activeMenu ? activeMenu.title : 'Trang nội bộ';
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon" style="color:var(--primary); background:var(--primary-light);">
              ${getMenuIconSvg(activeMenu ? activeMenu.icon : 'scan')}
            </div>
            <div class="state-title">${title}</div>
            <div class="state-desc">Phân hệ này đang trong lộ trình phát triển giai đoạn tiếp theo của Edufit.</div>
            <button class="state-btn" onclick="navigate('/thu-vien-bao-cao')">Quay lại Thư viện báo cáo</button>
          </div>
        `;
        return;
      }

      // 5. Danh sách báo cáo
      const filtered = getFilteredAndSortedReports();

      if (filtered.length === 0) {
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <div class="state-title">Không tìm thấy báo cáo phù hợp</div>
            <div class="state-desc">Không có báo cáo nào khớp với từ khóa "<strong>${escapeHtml(state.searchQuery)}</strong>" hoặc quyền xem hiện tại.</div>
            <button class="state-btn" onclick="clearAllFilters()">Xóa bộ lọc & Đặt lại</button>
          </div>
        `;
        return;
      }

      let html = '';
      state.groups.forEach(group => {
        // Nếu role hạn chế nhóm khác thì bỏ qua
        if (state.userRole !== 'ALL' && state.userRole !== group.id) return;

        const groupReports = filtered.filter(r => r.group.toUpperCase() === group.id.toUpperCase());
        if (groupReports.length === 0) return;

        html += `
          <section class="group-section">
            <div class="group-header">
              <span class="group-dot" style="background-color: ${group.color}"></span>
              <h2 class="group-title">${group.name}</h2>
              <span class="group-badge">${groupReports.length} báo cáo</span>
            </div>
        `;

        if (state.viewMode === 'grid') {
          html += `<div class="reports-grid">`;
          groupReports.forEach(r => {
            html += `
              <div class="report-card" tabindex="0" role="button" onclick="openReportDetail('${r.id}')" onkeydown="handleCardKeydown(event, '${r.id}')">
                <div class="card-thumbnail">
                  ${generateThumbnailSvg(r.color, r.seed)}
                </div>
                <div class="card-body">
                  <span class="card-tag" style="background-color: ${r.color}15; color: ${r.color}">
                    ${r.group}
                  </span>
                  <h3 class="card-title">${r.title.toUpperCase()}</h3>
                  <div class="card-subtitle">
                    <span>Ấn để xem chi tiết báo cáo</span>
                    <span class="card-date">${r.updated_at}</span>
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        } else {
          html += `<div class="reports-list">`;
          groupReports.forEach(r => {
            html += `
              <div class="report-list-item" tabindex="0" role="button" onclick="openReportDetail('${r.id}')" onkeydown="handleCardKeydown(event, '${r.id}')">
                <div class="list-thumbnail">
                  ${generateThumbnailSvg(r.color, r.seed)}
                </div>
                <div class="list-info">
                  <h3 class="list-title">${r.title.toUpperCase()}</h3>
                  <div class="list-meta">
                    <span class="card-tag" style="background-color: ${r.color}15; color: ${r.color};">${r.group}</span>
                    <span>Cập nhật: ${r.updated_at}</span>
                    <span>Mã: ${r.id}</span>
                  </div>
                </div>
                <div class="list-action-btn">
                  <span>Xem báo cáo</span>
                  <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        }

        html += `</section>`;
      });

      content.innerHTML = html;
    }

    // Chi tiết báo cáo có Sao chép Link & BI Dashboard trực quan (FR-08)
    function renderDetailView(reportId) {
      const content = document.getElementById('mainContent');
      const report = state.reports.find(r => r.id.toUpperCase() === reportId.toUpperCase());

      if (!report) {
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon" style="color:#ef4444; background:#fef2f2;">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
            </div>
            <div class="state-title">Không tìm thấy báo cáo (Mã: ${escapeHtml(reportId)})</div>
            <div class="state-desc">Báo cáo bạn đang tìm kiếm không tồn tại hoặc đã bị xóa khỏi hệ thống.</div>
            <button class="state-btn" onclick="backToLibrary()">Quay về Thư viện báo cáo</button>
          </div>
        `;
        return;
      }

      const group = state.groups.find(g => g.id === report.group) || { color: '#4f46e5', name: report.group };

      content.innerHTML = `
        <div class="detail-view">
          <div class="detail-nav-bar">
            <button class="back-btn" onclick="backToLibrary()">
              <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
              <span>Quay lại Thư viện</span>
            </button>

            <button class="copy-link-btn" onclick="copyCurrentReportLink('${report.id}')">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Sao chép liên kết</span>
            </button>
          </div>

          <div class="detail-header-card">
            <div>
              <h1 class="detail-title">${report.title.toUpperCase()}</h1>
              <div class="detail-meta-row">
                <span class="card-tag" style="background-color: ${group.color}15; color: ${group.color}; font-weight:800;">
                  ${report.group}
                </span>
                <span><strong>Mã:</strong> ${report.id}</span>
                <span><strong>Cập nhật:</strong> ${report.updated_at}</span>
              </div>
            </div>
            <div>
              <span style="font-size:12px; color:#16a34a; background:rgba(34, 197, 94, 0.1); border:1px solid rgba(34, 197, 94, 0.3); padding:5px 12px; border-radius:var(--radius-full); font-weight:700;">
                ● Live Dashboard
              </span>
            </div>
          </div>

          <!-- Khung nhúng giả lập BI Dashboard (FR-08) -->
          <div class="detail-embed-container">
            <div class="embed-toolbar">
              <div style="display:flex; align-items:center; gap:8px;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e;"></span>
                <span>Khung nhúng BI Dashboard:</span>
                <span class="embed-url-display">${report.embed_url}</span>
              </div>
              <div>
                <button onclick="showToast('Đang làm mới dữ liệu BI...')" style="color:var(--text-muted); font-size:12px; font-weight:600;">🔄 Làm mới dữ liệu</button>
              </div>
            </div>

            <div class="embed-frame-wrapper">
              <div class="mock-bi-dashboard">
                <div class="mock-bi-kpis">
                  <div class="mock-kpi-card">
                    <div class="mock-kpi-label">Tổng chỉ tiêu KPI</div>
                    <div class="mock-kpi-val">96.4%</div>
                    <div class="mock-kpi-trend">↑ +4.2% so với kỳ trước</div>
                  </div>
                  <div class="mock-kpi-card">
                    <div class="mock-kpi-label">Dữ liệu ghi nhận</div>
                    <div class="mock-kpi-val">2,450</div>
                    <div class="mock-kpi-trend">↑ 100% đúng hạn</div>
                  </div>
                  <div class="mock-kpi-card">
                    <div class="mock-kpi-label">Tỷ lệ chuyển đổi lead</div>
                    <div class="mock-kpi-val">38.2%</div>
                    <div class="mock-kpi-trend" style="color:#2563eb;">→ Vượt mục tiêu</div>
                  </div>
                  <div class="mock-kpi-card">
                    <div class="mock-kpi-label">Cơ sở hoạt động</div>
                    <div class="mock-kpi-val">14 / 14</div>
                    <div class="mock-kpi-trend">Toàn hệ thống</div>
                  </div>
                </div>

                <div class="mock-bi-chart-row">
                  <div class="mock-chart-card">
                    <div class="mock-chart-header">
                      <span class="mock-chart-title">Biểu đồ tiến độ thực hiện theo tháng (${report.group})</span>
                      <span class="mock-time-pill">90 ngày qua</span>
                    </div>
                    <svg viewBox="0 0 600 180" width="100%" height="180" style="margin-top:auto;">
                      <polyline fill="none" stroke="${group.color}" stroke-width="3" points="20,140 100,120 180,130 260,80 340,90 420,40 500,60 580,20"/>
                      <polyline fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4" points="20,160 100,150 180,140 260,110 340,120 420,90 500,80 580,50"/>
                      <circle cx="580" cy="20" r="5" fill="${group.color}"/>
                      <circle cx="580" cy="50" r="5" fill="#64748b"/>
                    </svg>
                  </div>
                  <div class="mock-chart-card">
                    <div class="mock-chart-header">
                      <span class="mock-chart-title">Cơ cấu dữ liệu</span>
                      <span class="mock-time-pill">Tỷ trọng</span>
                    </div>
                    <div style="flex:1; display:flex; align-items:center; justify-content:center;">
                      <svg viewBox="0 0 100 100" width="120" height="120">
                        <circle cx="50" cy="50" r="35" fill="none" stroke="var(--card-border)" stroke-width="16"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="${group.color}" stroke-width="16" stroke-dasharray="140 220"/>
                        <circle cx="50" cy="50" r="35" fill="none" stroke="#38bdf8" stroke-width="16" stroke-dasharray="60 220" stroke-dashoffset="-140"/>
                      </svg>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------
    // 5. ROUTING & EVENTS
    // -------------------------------------------------------------
    function navigate(path, updateHistory = true) {
      state.currentPath = path;
      if (updateHistory) syncUrlState();
      renderSidebar();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openReportDetail(reportId) {
      navigate(`/thu-vien-bao-cao/${reportId}`);
    }

    function backToLibrary() {
      navigate('/thu-vien-bao-cao');
    }

    function toggleGroupFilter(groupId) {
      if (state.selectedGroup === groupId) {
        state.selectedGroup = null;
      } else {
        state.selectedGroup = groupId;
      }
      
      if (state.currentPath !== '/thu-vien-bao-cao') {
        state.currentPath = '/thu-vien-bao-cao';
      }

      syncUrlState();
      renderGroupTags();
      renderContent();
    }

    function clearAllFilters() {
      state.selectedGroup = null;
      state.searchQuery = '';
      state.userRole = 'ALL';
      const rSel = document.getElementById('roleSelector');
      if (rSel) rSel.value = 'ALL';
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      updateClearBtnVisibility();
      syncUrlState();
      renderGroupTags();
      renderContent();
      showToast('Đã xóa tất cả bộ lọc');
    }

    function syncUrlState() {
      let url = state.currentPath;
      if (state.currentPath === '/thu-vien-bao-cao' || state.currentPath === '/') {
        const params = new URLSearchParams();
        if (state.selectedGroup) params.set('group', state.selectedGroup);
        if (state.searchQuery) params.set('q', state.searchQuery);
        const qStr = params.toString();
        if (qStr) url += `?${qStr}`;
      }
      history.pushState(null, '', url);
    }

    function parseUrlState() {
      const url = new URL(window.location.href);
      state.currentPath = url.pathname || '/thu-vien-bao-cao';
      
      const groupParam = url.searchParams.get('group');
      const qParam = url.searchParams.get('q') || url.searchParams.get('search');
      
      if (groupParam && state.groups.some(g => g.id.toUpperCase() === groupParam.toUpperCase())) {
        state.selectedGroup = groupParam.toUpperCase();
      } else {
        state.selectedGroup = null;
      }

      state.searchQuery = qParam || '';
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = state.searchQuery;
      updateClearBtnVisibility();
    }

    function updateClearBtnVisibility() {
      const btn = document.getElementById('clearSearchBtn');
      const hotkey = document.getElementById('searchHotkey');
      if (btn) btn.style.display = state.searchQuery ? 'block' : 'none';
      if (hotkey) hotkey.style.display = state.searchQuery ? 'none' : 'block';
    }

    function handleCardKeydown(e, reportId) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openReportDetail(reportId);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function retryFetchData() {
      state.hasError = false;
      state.isLoading = true;
      renderContent();
      setTimeout(() => {
        state.isLoading = false;
        renderContent();
        showToast('Đã kết nối lại dữ liệu thành công!');
      }, 500);
    }

    function copyCurrentReportLink(reportId) {
      const fullUrl = window.location.origin + `/thu-vien-bao-cao/${reportId}`;
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast(`Đã sao chép liên kết báo cáo ${reportId}!`);
      }).catch(() => {
        showToast(`Đã lưu URL: ${fullUrl}`);
      });
    }

    // Áp dụng Theme Sáng / Tối (Dark Mode)
    function applyTheme(theme) {
      state.currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('kpi_theme', theme);
      
      const sun = document.getElementById('themeIconSun');
      const moon = document.getElementById('themeIconMoon');
      if (theme === 'dark') {
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
      } else {
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
      }
      renderContent();
    }

    // -------------------------------------------------------------
    // 6. KHỞI TẠO ỨNG DỤNG
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Khôi phục theme
      applyTheme(state.currentTheme);

      // 2. Phục hồi trạng thái URL
      parseUrlState();

      // 3. Render
      renderSidebar();
      renderGroupTags();
      renderContent();

      // Sự kiện ô tìm kiếm
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim();
          updateClearBtnVisibility();
          
          if (state.simulateDelay) {
            state.isLoading = true;
            renderContent();
            clearTimeout(window._searchTimer);
            window._searchTimer = setTimeout(() => {
              state.isLoading = false;
              syncUrlState();
              renderContent();
            }, 600);
          } else {
            syncUrlState();
            renderContent();
          }
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          state.searchQuery = '';
          searchInput.value = '';
          updateClearBtnVisibility();
          syncUrlState();
          renderContent();
          searchInput.focus();
        });
      }

      // Hotkey Keyboard: '/' focus tìm kiếm, 'Escape' clear
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === 'Escape') {
          if (state.searchQuery) {
            state.searchQuery = '';
            searchInput.value = '';
            updateClearBtnVisibility();
            syncUrlState();
            renderContent();
          }
        }
      });

      // Chế độ Lưới / Danh sách
      const btnGrid = document.getElementById('btnViewGrid');
      const btnList = document.getElementById('btnViewList');

      function updateViewModeButtons() {
        if (state.viewMode === 'grid') {
          btnGrid.classList.add('active');
          btnList.classList.remove('active');
        } else {
          btnList.classList.add('active');
          btnGrid.classList.remove('active');
        }
      }
      updateViewModeButtons();

      btnGrid.addEventListener('click', () => {
        state.viewMode = 'grid';
        localStorage.setItem('kpi_view_mode', 'grid');
        updateViewModeButtons();
        renderContent();
        showToast('Đã chuyển sang dạng Lưới');
      });

      btnList.addEventListener('click', () => {
        state.viewMode = 'list';
        localStorage.setItem('kpi_view_mode', 'list');
        updateViewModeButtons();
        renderContent();
        showToast('Đã chuyển sang dạng Danh sách');
      });

      // Toggle Theme
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          const next = state.currentTheme === 'light' ? 'dark' : 'light';
          applyTheme(next);
          showToast(`Đã bật chế độ ${next === 'dark' ? 'Tối (Dark Mode)' : 'Sáng'}`);
        });
      }

      // Sắp xếp (Sort)
      const sortSelect = document.getElementById('sortSelect');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          state.sortBy = e.target.value;
          renderContent();
          showToast('Đã cập nhật thứ tự sắp xếp');
        });
      }

      // Phân quyền Mock RBAC
      const roleSelector = document.getElementById('roleSelector');
      if (roleSelector) {
        roleSelector.addEventListener('change', (e) => {
          state.userRole = e.target.value;
          state.selectedGroup = null;
          renderGroupTags();
          renderContent();
          showToast(`Đã đổi vai trò: ${e.target.options[e.target.selectedIndex].text}`);
        });
      }

      // Mobile Menu Toggle
      const mobileToggle = document.getElementById('mobileMenuToggle');
      const sidebarNav = document.getElementById('sidebarNav');
      if (mobileToggle && sidebarNav) {
        mobileToggle.addEventListener('click', () => {
          sidebarNav.classList.toggle('open');
        });
      }

      // Giả lập trạng thái Demo FR-09
      const simToggleBtn = document.getElementById('simToggleBtn');
      const simMenu = document.getElementById('simMenu');
      const simDelayCheck = document.getElementById('simDelayCheck');
      const simErrorCheck = document.getElementById('simErrorCheck');

      if (simToggleBtn && simMenu) {
        simToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          simMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => {
          simMenu.classList.remove('show');
        });

        simDelayCheck.addEventListener('change', (e) => {
          state.simulateDelay = e.target.checked;
          if (state.simulateDelay) {
            state.isLoading = true;
            renderContent();
            setTimeout(() => {
              state.isLoading = false;
              renderContent();
            }, 1000);
          }
        });

        simErrorCheck.addEventListener('change', (e) => {
          state.simulateError = e.target.checked;
          state.hasError = state.simulateError;
          renderContent();
        });
      }

      window.addEventListener('popstate', () => {
        parseUrlState();
        renderSidebar();
        renderGroupTags();
        renderContent();
      });
    });
  </script>
</body>
</html>
