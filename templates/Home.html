    // -------------------------------------------------------------
    // 5. ROUTING & EVENTS
    // -------------------------------------------------------------
    function navigate(path, updateHistory = true) {
      state.currentPath = path;
      if (updateHistory) syncUrlState();
      renderSidebar();
      renderContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openReportDetail(reportId) {
      navigate(`/thu-vien-bao-cao/${reportId}`);
    }

    function backToLibrary() {
      navigate('/thu-vien-bao-cao');
    }

    function toggleGroupFilter(groupId) {
      if (state.selectedGroup === groupId) {
        state.selectedGroup = null;
      } else {
        state.selectedGroup = groupId;
      }
      
      if (state.currentPath !== '/thu-vien-bao-cao') {
        state.currentPath = '/thu-vien-bao-cao';
      }

      syncUrlState();
      renderGroupTags();
      renderContent();
    }

    function clearAllFilters() {
      state.selectedGroup = null;
      state.searchQuery = '';
      state.userRole = 'ALL';
      const rSel = document.getElementById('roleSelector');
      if (rSel) rSel.value = 'ALL';
      const input = document.getElementById('searchInput');
      if (input) input.value = '';
      updateClearBtnVisibility();
      syncUrlState();
      renderGroupTags();
      renderContent();
      showToast('Đã xóa tất cả bộ lọc');
    }

    function syncUrlState() {
      let url = state.currentPath;
      if (state.currentPath === '/thu-vien-bao-cao' || state.currentPath === '/') {
        const params = new URLSearchParams();
        if (state.selectedGroup) params.set('group', state.selectedGroup);
        if (state.searchQuery) params.set('q', state.searchQuery);
        const qStr = params.toString();
        if (qStr) url += `?${qStr}`;
      }
      history.pushState(null, '', url);
    }

    function parseUrlState() {
      const url = new URL(window.location.href);
      state.currentPath = url.pathname || '/thu-vien-bao-cao';
      
      const groupParam = url.searchParams.get('group');
      const qParam = url.searchParams.get('q') || url.searchParams.get('search');
      
      if (groupParam && state.groups.some(g => g.id.toUpperCase() === groupParam.toUpperCase())) {
        state.selectedGroup = groupParam.toUpperCase();
      } else {
        state.selectedGroup = null;
      }

      state.searchQuery = qParam || '';
      const searchInput = document.getElementById('searchInput');
      if (searchInput) searchInput.value = state.searchQuery;
      updateClearBtnVisibility();
    }

    function updateClearBtnVisibility() {
      const btn = document.getElementById('clearSearchBtn');
      const hotkey = document.getElementById('searchHotkey');
      if (btn) btn.style.display = state.searchQuery ? 'block' : 'none';
      if (hotkey) hotkey.style.display = state.searchQuery ? 'none' : 'block';
    }

    function handleCardKeydown(e, reportId) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openReportDetail(reportId);
      }
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[m]);
    }

    function retryFetchData() {
      state.hasError = false;
      state.isLoading = true;
      renderContent();
      setTimeout(() => {
        state.isLoading = false;
        renderContent();
        showToast('Đã kết nối lại dữ liệu thành công!');
      }, 500);
    }

    function copyCurrentReportLink(reportId) {
      const fullUrl = window.location.origin + `/thu-vien-bao-cao/${reportId}`;
      navigator.clipboard.writeText(fullUrl).then(() => {
        showToast(`Đã sao chép liên kết báo cáo ${reportId}!`);
      }).catch(() => {
        showToast(`Đã lưu URL: ${fullUrl}`);
      });
    }

    // Áp dụng Theme Sáng / Tối (Dark Mode)
    function applyTheme(theme) {
      state.currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('kpi_theme', theme);
      
      const sun = document.getElementById('themeIconSun');
      const moon = document.getElementById('themeIconMoon');
      if (theme === 'dark') {
        if (sun) sun.style.display = 'block';
        if (moon) moon.style.display = 'none';
      } else {
        if (sun) sun.style.display = 'none';
        if (moon) moon.style.display = 'block';
      }
      renderContent();
    }

    // Quản lý Modal Thêm / Sửa báo cáo (In-app Add & Edit Report)
    function openAddModal() {
      const modal = document.getElementById('addReportModal');
      if (!modal) return;

      // Đặt chế độ Tạo mới (Create)
      document.getElementById('formMode').value = 'create';
      document.getElementById('editingReportId').value = '';
      document.getElementById('modalFormTitle').textContent = 'Thêm Báo Cáo Mới';
      document.getElementById('modalIconBadge').textContent = '+';
      document.getElementById('modalSubmitText').textContent = 'Lưu & Hiển thị ngay';

      const idInput = document.getElementById('newReportId');
      idInput.readOnly = false;
      idInput.style.opacity = '1';
      idInput.style.cursor = 'text';

      // Tự động tính mã báo cáo tiếp theo (Ví dụ: R13 hoặc R14...)
      let maxNum = 0;
      state.reports.forEach(r => {
        const m = r.id.match(/^R(\d+)$/i);
        if (m) {
          const n = parseInt(m[1], 10);
          if (n > maxNum) maxNum = n;
        }
      });
      const nextId = 'R' + String(maxNum + 1).padStart(2, '0');
      idInput.value = nextId;

      // Điền danh sách nhóm phòng ban động
      const groupSelect = document.getElementById('newReportGroup');
      if (groupSelect) {
        let optHtml = '';
        state.groups.forEach(g => {
          optHtml += `<option value="${g.id}">${g.name} (${g.id})</option>`;
        });
        optHtml += `<option value="__NEW__">+ Tạo nhóm phòng ban mới...</option>`;
        groupSelect.innerHTML = optHtml;
      }

      // Điền ngày hiện tại dạng dd/mm/yyyy
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      document.getElementById('newReportDate').value = `${dd}/${mm}/${yyyy}`;

      // Reset các ô nhập
      document.getElementById('newReportTitle').value = '';
      document.getElementById('newReportSeed').value = Math.floor(Math.random() * 80) + 15;
      document.getElementById('newReportEmbed').value = `https://bi.example.vn/embed/${nextId}`;
      document.getElementById('customGroupName').value = '';
      document.getElementById('customGroupFields').style.display = 'none';

      modal.classList.add('show');
      setTimeout(() => {
        const titleInput = document.getElementById('newReportTitle');
        if (titleInput) titleInput.focus();
      }, 60);
    }

    function openEditModal(reportId) {
      const report = state.reports.find(r => r.id.toUpperCase() === reportId.toUpperCase());
      if (!report) {
        showToast('Không tìm thấy báo cáo để chỉnh sửa!');
        return;
      }

      const modal = document.getElementById('addReportModal');
      if (!modal) return;

      // Đặt chế độ Sửa (Edit)
      document.getElementById('formMode').value = 'edit';
      document.getElementById('editingReportId').value = report.id;
      document.getElementById('modalFormTitle').textContent = `Chỉnh Sửa Báo Cáo [${report.id}]`;
      document.getElementById('modalIconBadge').textContent = '✎';
      document.getElementById('modalSubmitText').textContent = 'Cập nhật thay đổi';

      const idInput = document.getElementById('newReportId');
      idInput.value = report.id;
      idInput.readOnly = true;
      idInput.style.opacity = '0.7';
      idInput.style.cursor = 'not-allowed';

      // Điền danh sách nhóm phòng ban
      const groupSelect = document.getElementById('newReportGroup');
      if (groupSelect) {
        let optHtml = '';
        state.groups.forEach(g => {
          const sel = g.id.toUpperCase() === report.group.toUpperCase() ? 'selected' : '';
          optHtml += `<option value="${g.id}" ${sel}>${g.name} (${g.id})</option>`;
        });
        optHtml += `<option value="__NEW__">+ Tạo nhóm phòng ban mới...</option>`;
        groupSelect.innerHTML = optHtml;
      }

      // Điền thông tin báo cáo
      document.getElementById('newReportTitle').value = report.title;
      document.getElementById('newReportDate').value = report.updated_at;
      document.getElementById('newReportSeed').value = report.seed;
      document.getElementById('newReportEmbed').value = report.embed_url;
      document.getElementById('customGroupName').value = '';
      document.getElementById('customGroupFields').style.display = 'none';

      modal.classList.add('show');
      setTimeout(() => {
        const titleInput = document.getElementById('newReportTitle');
        if (titleInput) {
          titleInput.focus();
          titleInput.select();
        }
      }, 60);
    }

    function deleteReport(reportId) {
      const report = state.reports.find(r => r.id.toUpperCase() === reportId.toUpperCase());
      if (!report) return;

      if (!confirm(`Bạn có chắc chắn muốn xóa báo cáo:\n"${report.title}" (Mã: ${report.id})?\n\nLưu ý: Có thể khôi phục lại bất kỳ lúc nào bằng nút "Đặt lại 12 báo cáo gốc" trong menu Demo Lab.`)) {
        return;
      }

      // Xóa khỏi danh sách state
      state.reports = state.reports.filter(r => r.id.toUpperCase() !== report.id.toUpperCase());

      // Lưu cập nhật vào localStorage
      saveReportsToStorage();

      // Gửi API xóa backend nếu chạy local server
      fetch(`/api/reports/${report.id}`, { method: 'DELETE' }).catch(() => {});

      showToast(`🗑️ Đã xóa báo cáo ${report.id} thành công!`);

      // Nếu đang ở trang chi tiết của báo cáo bị xóa, quay về thư viện
      if (state.currentPath.includes(report.id)) {
        navigate('/thu-vien-bao-cao');
      } else {
        renderGroupTags();
        renderContent();
      }
    }

    function closeAddModal() {
      const modal = document.getElementById('addReportModal');
      if (modal) modal.classList.remove('show');
    }

    function resetToDefaultData() {
      if (!confirm('Bạn có chắc chắn muốn đặt lại danh sách báo cáo mặc định (xóa mọi chỉnh sửa/thêm mới và khôi phục 12 báo cáo gốc)?')) return;
      try {
        localStorage.removeItem('kpi_all_reports');
        localStorage.removeItem('kpi_custom_reports');
        localStorage.removeItem('kpi_custom_groups');
      } catch (e) {}
      state.groups = [...(APP_DATA.groups || [])];
      state.reports = [...(APP_DATA.reports || [])];
      renderGroupTags();
      renderContent();
      showToast('Đã khôi phục danh sách 12 báo cáo mặc định ban đầu!');
    }

    // -------------------------------------------------------------
    // 6. KHỞI TẠO ỨNG DỤNG
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Khôi phục theme
      applyTheme(state.currentTheme);

      // 2. Phục hồi trạng thái URL
      parseUrlState();

      // 3. Render
      renderSidebar();
      renderGroupTags();
      renderContent();

      // Sự kiện ô tìm kiếm
      const searchInput = document.getElementById('searchInput');
      const clearSearchBtn = document.getElementById('clearSearchBtn');
      
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          state.searchQuery = e.target.value.trim();
          updateClearBtnVisibility();
          
          if (state.simulateDelay) {
            state.isLoading = true;
            renderContent();
            clearTimeout(window._searchTimer);
            window._searchTimer = setTimeout(() => {
              state.isLoading = false;
              syncUrlState();
              renderContent();
            }, 600);
          } else {
            syncUrlState();
            renderContent();
          }
        });
      }

      if (clearSearchBtn) {
        clearSearchBtn.addEventListener('click', () => {
          state.searchQuery = '';
          searchInput.value = '';
          updateClearBtnVisibility();
          syncUrlState();
          renderContent();
          searchInput.focus();
        });
      }

      // Hotkey Keyboard: '/' focus tìm kiếm, 'Escape' clear
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== searchInput) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
        } else if (e.key === 'Escape') {
          const modal = document.getElementById('addReportModal');
          if (modal && modal.classList.contains('show')) {
            closeAddModal();
            return;
          }
          if (state.searchQuery) {
            state.searchQuery = '';
            searchInput.value = '';
            updateClearBtnVisibility();
            syncUrlState();
            renderContent();
          }
        }
      });

      // Chế độ Lưới / Danh sách
      const btnGrid = document.getElementById('btnViewGrid');
      const btnList = document.getElementById('btnViewList');

      function updateViewModeButtons() {
        if (state.viewMode === 'grid') {
          btnGrid.classList.add('active');
          btnList.classList.remove('active');
        } else {
          btnList.classList.add('active');
          btnGrid.classList.remove('active');
        }
      }
      updateViewModeButtons();

      btnGrid.addEventListener('click', () => {
        state.viewMode = 'grid';
        localStorage.setItem('kpi_view_mode', 'grid');
        updateViewModeButtons();
        renderContent();
        showToast('Đã chuyển sang dạng Lưới');
      });

      btnList.addEventListener('click', () => {
        state.viewMode = 'list';
        localStorage.setItem('kpi_view_mode', 'list');
        updateViewModeButtons();
        renderContent();
        showToast('Đã chuyển sang dạng Danh sách');
      });

      // Toggle Theme
      const themeToggleBtn = document.getElementById('themeToggleBtn');
      if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
          const next = state.currentTheme === 'light' ? 'dark' : 'light';
          applyTheme(next);
          showToast(`Đã bật chế độ ${next === 'dark' ? 'Tối (Dark Mode)' : 'Sáng'}`);
        });
      }

      // Sắp xếp (Sort)
      const sortSelect = document.getElementById('sortSelect');
      if (sortSelect) {
        sortSelect.addEventListener('change', (e) => {
          state.sortBy = e.target.value;
          renderContent();
          showToast('Đã cập nhật thứ tự sắp xếp');
        });
      }

      // Phân quyền Mock RBAC
      const roleSelector = document.getElementById('roleSelector');
      if (roleSelector) {
        roleSelector.addEventListener('change', (e) => {
          state.userRole = e.target.value;
          state.selectedGroup = null;
          renderGroupTags();
          renderContent();
          showToast(`Đã đổi vai trò: ${e.target.options[e.target.selectedIndex].text}`);
        });
      }

      // Mobile Menu Toggle
      const mobileToggle = document.getElementById('mobileMenuToggle');
      const sidebarNav = document.getElementById('sidebarNav');
      if (mobileToggle && sidebarNav) {
        mobileToggle.addEventListener('click', () => {
          sidebarNav.classList.toggle('open');
        });
      }

      // Giả lập trạng thái Demo FR-09
      const simToggleBtn = document.getElementById('simToggleBtn');
      const simMenu = document.getElementById('simMenu');
      const simDelayCheck = document.getElementById('simDelayCheck');
      const simErrorCheck = document.getElementById('simErrorCheck');

      if (simToggleBtn && simMenu) {
        simToggleBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          simMenu.classList.toggle('show');
        });

        document.addEventListener('click', () => {
          simMenu.classList.remove('show');
        });

        simDelayCheck.addEventListener('change', (e) => {
          state.simulateDelay = e.target.checked;
          if (state.simulateDelay) {
            state.isLoading = true;
            renderContent();
            setTimeout(() => {
              state.isLoading = false;
              renderContent();
            }, 1000);
          }
        });

        simErrorCheck.addEventListener('change', (e) => {
          state.simulateError = e.target.checked;
          state.hasError = state.simulateError;
          renderContent();
        });
      }

      // ============================================================
      // Sự kiện Modal Thêm báo cáo mới (In-app Add Report)
      // ============================================================
      const openAddBtn = document.getElementById('openAddModalBtn');
      const closeAddBtn = document.getElementById('closeAddModalBtn');
      const cancelAddBtn = document.getElementById('cancelAddBtn');
      const addModal = document.getElementById('addReportModal');
      const newGroupSelect = document.getElementById('newReportGroup');
      const customGroupFields = document.getElementById('customGroupFields');
      const addReportForm = document.getElementById('addReportForm');
      const newReportIdInput = document.getElementById('newReportId');

      if (openAddBtn) openAddBtn.addEventListener('click', openAddModal);
      if (closeAddBtn) closeAddBtn.addEventListener('click', closeAddModal);
      if (cancelAddBtn) cancelAddBtn.addEventListener('click', closeAddModal);

      if (addModal) {
        addModal.addEventListener('click', (e) => {
          if (e.target === addModal) closeAddModal();
        });
      }

      if (newGroupSelect) {
        newGroupSelect.addEventListener('change', () => {
          if (newGroupSelect.value === '__NEW__') {
            customGroupFields.style.display = 'flex';
            const cgName = document.getElementById('customGroupName');
            if (cgName) cgName.focus();
          } else {
            customGroupFields.style.display = 'none';
          }
        });
      }

      if (newReportIdInput) {
        newReportIdInput.addEventListener('input', () => {
          const val = newReportIdInput.value.trim().toUpperCase();
          const embedInput = document.getElementById('newReportEmbed');
          if (embedInput && (!embedInput.value || embedInput.value.includes('/embed/'))) {
            embedInput.value = `https://bi.example.vn/embed/${val}`;
          }
        });
      }

      if (addReportForm) {
        addReportForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const mode = document.getElementById('formMode').value;
          const editingId = document.getElementById('editingReportId').value;
          const title = document.getElementById('newReportTitle').value.trim();
          let groupId = newGroupSelect.value;
          const reportId = document.getElementById('newReportId').value.trim().toUpperCase();
          const dateStr = document.getElementById('newReportDate').value.trim();
          const seedVal = parseFloat(document.getElementById('newReportSeed').value) || 15.0;
          const embedUrl = document.getElementById('newReportEmbed').value.trim() || `https://bi.example.vn/embed/${reportId}`;

          if (!title || !reportId) {
            showToast('Vui lòng nhập đầy đủ tên và mã báo cáo!');
            return;
          }

          if (mode === 'create') {
            // Kiểm tra trùng mã ID khi tạo mới
            if (state.reports.some(r => r.id.toUpperCase() === reportId)) {
              showToast(`Mã báo cáo "${reportId}" đã tồn tại! Vui lòng chọn mã khác.`);
              return;
            }
          }

          let reportColor = '#4f46e5';

          // Xử lý nhóm phòng ban mới
          if (groupId === '__NEW__') {
            const customName = document.getElementById('customGroupName').value.trim();
            const customColor = document.getElementById('customGroupColor').value;
            if (!customName) {
              showToast('Vui lòng nhập tên cho nhóm phòng ban mới!');
              return;
            }

            let generatedCode = customName.split(' ').map(w => w[0]).join('').toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (!generatedCode || generatedCode.length < 2) {
              generatedCode = customName.substring(0, 4).toUpperCase();
            }
            if (state.groups.some(g => g.id === generatedCode)) {
              generatedCode = generatedCode + (state.groups.length + 1);
            }

            const newGroupObj = {
              id: generatedCode,
              name: customName,
              color: customColor
            };
            state.groups.push(newGroupObj);
            groupId = generatedCode;
            reportColor = customColor;

            // Lưu nhóm mới vào localStorage
            try {
              const savedGroups = JSON.parse(localStorage.getItem('kpi_custom_groups') || '[]');
              savedGroups.push(newGroupObj);
              localStorage.setItem('kpi_custom_groups', JSON.stringify(savedGroups));
            } catch (err) {}
          } else {
            const foundG = state.groups.find(g => g.id === groupId);
            if (foundG) reportColor = foundG.color;
          }

          if (mode === 'edit') {
            // CẬP NHẬT BÁO CÁO (UPDATE)
            const targetIdx = state.reports.findIndex(r => r.id.toUpperCase() === editingId.toUpperCase());
            if (targetIdx >= 0) {
              state.reports[targetIdx] = {
                ...state.reports[targetIdx],
                title: title,
                group: groupId,
                color: reportColor,
                seed: seedVal,
                updated_at: dateStr || state.reports[targetIdx].updated_at,
                embed_url: embedUrl
              };

              // Lưu vào localStorage
              saveReportsToStorage();

              // Gửi API cập nhật PUT lên backend
              fetch(`/api/reports/${editingId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(state.reports[targetIdx])
              }).catch(() => {});

              closeAddModal();
              renderGroupTags();
              renderContent();
              showToast(`✏️ Đã cập nhật báo cáo ${editingId} thành công!`);
            }
          } else {
            // TẠO MỚI BÁO CÁO (CREATE)
            const newReport = {
              id: reportId,
              title: title,
              group: groupId,
              color: reportColor,
              seed: seedVal,
              updated_at: dateStr || '18/10/2026',
              embed_url: embedUrl
            };

            state.reports.push(newReport);
            saveReportsToStorage();

            fetch('/api/reports', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(newReport)
            }).catch(() => {});

            closeAddModal();
            renderGroupTags();
            renderContent();
            showToast(`🎉 Đã thêm báo cáo ${newReport.id} thành công!`);

            setTimeout(() => {
              openReportDetail(newReport.id);
            }, 350);
          }
        });
      }

      window.addEventListener('popstate', () => {
        parseUrlState();
        renderSidebar();
        renderGroupTags();
        renderContent();
      });
    });
  </script>
</body>
</html>
