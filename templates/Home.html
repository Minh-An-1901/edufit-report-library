<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện báo cáo - KPIMATRIX Edufit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  
  <style>
    /* ============================================================
       1. DESIGN TOKENS & DUAL-THEME ENGINE (LIGHT & DARK MODE - BN-01)
       ============================================================ */
    :root {
      /* Base Colors - Light Theme */
      --body-bg: #f8fafc;
      --surface-bg: #ffffff;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-border-hover: #cbd5e1;
      
      --sidebar-bg: #0b1329;
      --sidebar-hover: rgba(255, 255, 255, 0.07);
      --sidebar-active-bg: rgba(79, 70, 229, 0.28);
      --sidebar-active-border: rgba(129, 140, 248, 0.4);
      --sidebar-text: #94a3b8;
      --sidebar-text-active: #ffffff;
      
      --toolbar-bg: rgba(255, 255, 255, 0.85);
      --toolbar-border: #e2e8f0;
      
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;
      --radius-full: 9999px;
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 12px 28px -6px rgba(0, 0, 0, 0.09), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      /* Base Colors - Dark Theme (BN-01) */
      --body-bg: #070d1e;
      --surface-bg: #0f172a;
      --card-bg: #0f172a;
      --card-border: #1e293b;
      --card-border-hover: #334155;
      
      --sidebar-bg: #040814;
      --sidebar-hover: rgba(255, 255, 255, 0.05);
      --sidebar-active-bg: rgba(99, 102, 241, 0.22);
      --sidebar-active-border: rgba(99, 102, 241, 0.4);
      --sidebar-text: #64748b;
      --sidebar-text-active: #f8fafc;
      
      --toolbar-bg: rgba(11, 19, 41, 0.85);
      --toolbar-border: #1e293b;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: var(--body-bg);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      font-size: 14px;
      transition: background-color var(--transition-smooth), color var(--transition-smooth);
    }

    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; border: none; background: none; cursor: pointer; outline: none; }

    button:focus-visible, input:focus-visible, [tabindex="0"]:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    /* ============================================================
       2. SIDEBAR CỐ ĐỊNH BÊN TRÁI (FR-01)
       ============================================================ */
    .sidebar {
      width: 240px;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 100;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      transition: var(--transition-smooth);
    }

    .brand-logo {
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
    }

    .logo-cube {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      position: relative;
    }

    .logo-cube::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .logo-cube svg { width: 22px; height: 22px; fill: #ffffff; }

    .logo-text {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .logo-text .kpi { color: #ffffff; }
    .logo-text .matrix { color: #60a5fa; }

    .nav-list {
      list-style: none;
      padding: 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
      overflow-y: auto;
    }

    .nav-item button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border-radius: var(--radius-md);
      color: var(--sidebar-text);
      font-weight: 600;
      font-size: 13.5px;
      transition: var(--transition-fast);
      text-align: left;
      position: relative;
    }

    .nav-item button:hover {
      background-color: var(--sidebar-hover);
      color: #ffffff;
      transform: translateX(2px);
    }

    .nav-item.active button {
      background-color: var(--sidebar-active-bg);
      border: 1px solid var(--sidebar-active-border);
      color: var(--sidebar-text-active);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    .nav-item button svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.85;
      transition: var(--transition-fast);
    }

    .nav-item.active button svg {
      opacity: 1;
      stroke: #818cf8;
    }

    /* Phân quyền giả định (Mock Role Selector - BN-01) */
    .role-selector-card {
      padding: 14px 16px;
      margin: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .role-label {
      font-size: 11px;
      text-transform: uppercase;
      font-weight: 700;
      color: #64748b;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .role-select {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e2e8f0;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .role-select option { background: #0b1329; color: #ffffff; }

    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-menu-btn { display: none; padding: 8px; border-radius: var(--radius-sm); color: var(--text-main); }

    /* ============================================================
       3. TOP TOOLBAR & CONTROLS (FR-02)
       ============================================================ */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background-color: var(--body-bg);
      transition: background-color var(--transition-smooth);
    }

    .toolbar {
      background-color: var(--toolbar-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--toolbar-border);
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      position: sticky;
      top: 0;
      z-index: 90;
      flex-wrap: wrap;
      transition: border-color var(--transition-smooth);
    }

    .page-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--text-main);
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* Tag Pills (FR-03) */
    .tags-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 13px;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 700;
      border: 1.5px solid transparent;
      transition: var(--transition-fast);
      cursor: pointer;
      user-select: none;
    }

    .tag-pill svg { width: 13px; height: 13px; }

    /* Tag styles per group */
    .tag-pill[data-group="TDS"] { color: #4f46e5; background: rgba(79, 70, 229, 0.08); border-color: rgba(79, 70, 229, 0.25); }
    .tag-pill[data-group="TDS"].active { background: #4f46e5; color: #ffffff; border-color: #4f46e5; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35); }

    .tag-pill[data-group="SKR"] { color: #e0527a; background: rgba(224, 82, 122, 0.08); border-color: rgba(224, 82, 122, 0.25); }
    .tag-pill[data-group="SKR"].active { background: #e0527a; color: #ffffff; border-color: #e0527a; box-shadow: 0 4px 12px rgba(224, 82, 122, 0.35); }

    .tag-pill[data-group="ASC"] { color: #f0842c; background: rgba(240, 132, 44, 0.08); border-color: rgba(240, 132, 44, 0.25); }
    .tag-pill[data-group="ASC"].active { background: #f0842c; color: #ffffff; border-color: #f0842c; box-shadow: 0 4px 12px rgba(240, 132, 44, 0.35); }

    .tag-pill[data-group="TN"] { color: #22a06b; background: rgba(34, 160, 107, 0.08); border-color: rgba(34, 160, 107, 0.25); }
    .tag-pill[data-group="TN"].active { background: #22a06b; color: #ffffff; border-color: #22a06b; box-shadow: 0 4px 12px rgba(34, 160, 107, 0.35); }

    .tag-pill:hover { transform: translateY(-1px); }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background-color: var(--toolbar-border);
      margin: 0 4px;
    }

    .toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Ô tìm kiếm thông minh có Hotkey badge (FR-06, UI-03) */
    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      color: var(--text-light);
      pointer-events: none;
    }

    .search-input {
      padding: 7px 58px 7px 34px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background-color: var(--body-bg);
      font-size: 13px;
      width: 220px;
      font-family: inherit;
      color: var(--text-main);
      transition: var(--transition-fast);
    }

    .search-input:focus {
      background-color: var(--surface-bg);
      border-color: var(--primary);
      width: 260px;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .hotkey-badge {
      position: absolute;
      right: 28px;
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      padding: 2px 5px;
      background: var(--card-border);
      color: var(--text-muted);
      border-radius: 4px;
      pointer-events: none;
    }

    .clear-search-btn {
      position: absolute;
      right: 8px;
      color: var(--text-light);
      display: none;
      font-size: 16px;
      line-height: 1;
      padding: 2px 4px;
    }
    .clear-search-btn:hover { color: var(--text-main); }

    /* Dropdown Sắp xếp (BN-01) */
    .sort-select {
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: var(--radius-full);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .sort-select:hover { border-color: var(--primary); }

    /* View Switcher (FR-07) */
    .view-switcher {
      display: flex;
      align-items: center;
      background-color: var(--body-bg);
      border-radius: var(--radius-md);
      padding: 3px;
      border: 1px solid var(--card-border);
    }

    .view-btn {
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }

    .view-btn.active {
      background-color: var(--surface-bg);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }
    .view-btn svg { width: 15px; height: 15px; }

    /* Dark Mode Toggle Button (BN-01) */
    .theme-toggle-btn {
      padding: 7px;
      border-radius: var(--radius-full);
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-fast);
    }
    .theme-toggle-btn:hover {
      background-color: var(--card-border);
      transform: rotate(15deg);
    }
    .theme-toggle-btn svg { width: 16px; height: 16px; }

    /* Simulator Dropdown (FR-09) */
    .simulator-wrapper { position: relative; }
    .sim-toggle-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: var(--radius-full);
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.1), rgba(59, 130, 246, 0.1));
      color: var(--primary);
      border: 1px solid rgba(79, 70, 229, 0.25);
    }
    .sim-toggle-btn:hover { background: rgba(79, 70, 229, 0.15); }

    .sim-menu {
      position: absolute;
      right: 0;
      top: 120%;
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-lg);
      width: 220px;
      display: none;
      flex-direction: column;
      gap: 10px;
      z-index: 200;
    }
    .sim-menu.show { display: flex; }
    .sim-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-main); }
    .sim-item input[type="checkbox"] { cursor: pointer; accent-color: var(--primary); }

    /* NÚT THÊM BÁO CÁO TRỰC TIẾP TRÊN WEB */
    .add-report-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      background: var(--primary);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
      transition: var(--transition-fast);
      cursor: pointer;
    }
    .add-report-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
    }

    /* MODAL FORM THÊM BÁO CÁO */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: fadeIn 0.2s ease-out;
    }
    .modal-backdrop.show { display: flex; }

    .modal-card {
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      animation: modalSlide 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes modalSlide {
      from { transform: translateY(16px) scale(0.98); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-icon-badge {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--primary-light);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .modal-title { font-size: 16px; font-weight: 800; color: var(--text-main); }
    .modal-close-btn { font-size: 20px; color: var(--text-muted); cursor: pointer; padding: 2px 6px; }
    .modal-close-btn:hover { color: var(--text-main); }

    .modal-form { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .form-row { display: flex; gap: 14px; }
    .form-label { font-size: 12px; font-weight: 700; color: var(--text-muted); }
    .form-input, .form-select {
      background: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: var(--transition-fast);
    }
    .form-input:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      background: var(--surface-bg);
    }
    .custom-group-box {
      background: var(--body-bg);
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--card-border);
    }
    .form-color-picker {
      height: 38px;
      width: 100%;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      cursor: pointer;
      background: none;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
      margin-top: 6px;
    }
    .btn-cancel {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
      background: var(--body-bg);
      border: 1px solid var(--card-border);
      cursor: pointer;
    }
    .btn-cancel:hover { background: var(--card-border); color: var(--text-main); }
    .btn-submit {
      padding: 9px 20px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      color: #ffffff;
      background: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
      cursor: pointer;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    /* ============================================================
       4. MAIN CONTENT & CARDS (FR-04, FR-05)
       ============================================================ */
    .content-area {
      padding: 26px 28px;
      flex: 1;
    }

    .group-section {
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 24px 26px;
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.3s ease-in-out;
      transition: background-color var(--transition-smooth), border-color var(--transition-smooth);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }

    .group-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .group-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: 0.3px;
    }

    .group-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    /* CARDS GRID (FR-05) */
    .reports-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    .report-card {
      background-color: var(--body-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition-fast);
      cursor: pointer;
      position: relative;
    }

    .report-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--card-border-hover);
    }

    /* PROCEDURAL ABSTRACT DATA ART THUMBNAILS (FR-05 - Nâng cấp) */
    .card-thumbnail {
      width: 100%;
      height: 135px;
      background: var(--body-bg);
      border-bottom: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    .card-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .card-tag {
      align-self: flex-start;
      font-size: 11px;

    .report-list-item:hover {
      transform: translateX(4px);
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    .list-thumbnail {
      width: 50px;
      height: 50px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--card-border);
    }

    .list-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .list-title { font-size: 14.5px; font-weight: 700; color: var(--text-main); }
    .list-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--text-muted); }
    .list-action-btn { font-size: 13px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 4px; }

    /* ============================================================
       5. TRANG CHI TIẾT BÁO CÁO (FR-08) & BI DASHBOARD MÔ PHỎNG
       ============================================================ */
    .detail-view { display: flex; flex-direction: column; gap: 18px; animation: fadeIn 0.25s ease-out; }
    
    .detail-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-weight: 700;
      color: var(--text-main);
      font-size: 13px;
      transition: var(--transition-fast);
    }
    .back-btn:hover { background-color: var(--body-bg); border-color: var(--primary); color: var(--primary); }

    .copy-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition-fast);
      cursor: pointer;
    }
    .copy-link-btn:hover { border-color: var(--primary); color: var(--primary); }

    .edit-btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .edit-btn-action:hover {
      background-color: var(--primary-light);
      border-color: var(--primary);
    }

    .delete-btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: var(--card-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 700;
      color: #ef4444;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .delete-btn-action:hover {
      background-color: #fef2f2;
      border-color: #ef4444;
    }

    /* Quick actions trên thẻ card */
    .card-quick-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: opacity var(--transition-fast), transform var(--transition-fast);
      transform: translateY(-2px);
      z-index: 5;
    }
    .report-card:hover .card-quick-actions,
    .report-card:focus-within .card-quick-actions {
      opacity: 1;
      transform: translateY(0);
    }
    .card-action-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--radius-sm);
      background: var(--surface-bg);
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      transition: var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }
    .card-action-icon.edit-icon:hover {
      color: var(--primary);
      border-color: var(--primary);
      background: var(--primary-light);
      transform: scale(1.08);
    }
    .card-action-icon.delete-icon:hover {
      color: #ef4444;
      border-color: #ef4444;
      background: #fef2f2;
      transform: scale(1.08);
    }
    .list-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-right: 8px;
    }

    .detail-header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
    }

    .detail-title { font-size: 21px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; }
    .detail-meta-row { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; }

    .detail-embed-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-md);
    }

    .embed-toolbar {
      background: var(--body-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .embed-url-display {
      font-family: 'JetBrains Mono', monospace;
      background: var(--surface-bg);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      color: #3b82f6;
    }

    .embed-frame-wrapper {
      height: 540px;
      position: relative;
      background: var(--body-bg);
      display: flex;
      flex-direction: column;
    }

    /* MÔ PHỎNG BI DASHBOARD CÓ TƯƠNG TÁC */
    .mock-bi-dashboard {
      padding: 24px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    .mock-bi-filters {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 4px;
    }

    .mock-filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mock-date-pill {
      font-size: 11.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: var(--radius-full);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .mock-date-pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    .mock-select {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mock-btn-action {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: var(--transition-fast);
    }
    .mock-btn-action:hover { border-color: var(--primary); color: var(--primary); }

    .mock-bi-kpis {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .mock-kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .mock-kpi-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .mock-kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .mock-kpi-val { font-size: 24px; font-weight: 800; color: var(--text-main); letter-spacing: -0.5px; }
    
    .mock-kpi-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--card-border);
    }

    .mock-kpi-trend { font-size: 11.5px; color: #16a34a; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .mock-kpi-sub { font-size: 11px; color: var(--text-light); }

    .mock-bi-chart-row {
      display: grid;
      grid-template-columns: 2.1fr 1fr;
      gap: 16px;
      flex: 1;
    }

    .mock-chart-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: var(--shadow-sm);
    }

    .mock-chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .mock-chart-title { font-size: 13.5px; font-weight: 800; color: var(--text-main); }
    .mock-chart-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      background: var(--body-bg);
      border-radius: var(--radius-full);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    /* Ranking bars */
    .mock-ranking-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 8px;
    }

    .mock-ranking-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .mock-ranking-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
    }

    .mock-ranking-name { color: var(--text-main); }
    .mock-ranking-val { color: var(--primary); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

    .mock-progress-track {
      width: 100%;
      height: 6px;
      background: var(--body-bg);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .mock-progress-fill {
      height: 100%;
      border-radius: var(--radius-full);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Donut Legend */
    .mock-donut-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: auto;
      margin-bottom: auto;
    }

    .mock-legend-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .mock-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .mock-legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ============================================================
       6. TRẠNG THÁI: LOADING SKELETON, EMPTY, ERROR, 404 (FR-09)
       ============================================================ */
    .state-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 50px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }

    .state-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--body-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .state-icon svg { width: 28px; height: 28px; }
    .state-title { font-size: 18px; font-weight: 800; color: var(--text-main); }
    .state-desc { font-size: 13.5px; color: var(--text-muted); max-width: 440px; }

    .state-btn {
      padding: 8px 20px;
      background: var(--primary);
      color: #ffffff;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 13px;
      margin-top: 6px;
      transition: var(--transition-fast);
    }
    .state-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .skeleton {
      animation: skeleton-pulse 1.5s infinite;
      background: linear-gradient(90deg, var(--card-border) 25%, var(--body-bg) 50%, var(--card-border) 75%);
      background-size: 200% 100%;
      border-radius: var(--radius-sm);
    }
    @keyframes skeleton-pulse {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* TOAST NOTIFICATION */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast-message {
      background: #0f172a;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      animation: toastIn 0.25s ease-out forwards;
      pointer-events: auto;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================================
       7. RESPONSIVE DESIGN (UI-02: 768px, 360px)
       ============================================================ */
    @media (max-width: 1024px) {
      .mock-bi-kpis { grid-template-columns: repeat(2, 1fr); }
      .mock-bi-chart-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .sidebar { width: 100%; height: auto; position: relative; }
      .brand-logo { justify-content: space-between; }
      .nav-list { display: none; }
      .nav-list.open { display: flex; }
      .mobile-menu-btn { display: block; }
      .toolbar { padding: 12px 16px; gap: 10px; }
      .toolbar-right { margin-left: 0; width: 100%; justify-content: space-between; }
      .search-input { width: 100% !important; }
      .search-box { flex: 1; }
      .content-area { padding: 16px; }
      .reports-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .tags-container { width: 100%; overflow-x: auto; padding-bottom: 4px; }
      .page-title { width: 100%; }
      .mock-bi-kpis { grid-template-columns: 1fr; }
    }
  </style>
</head>

        <!-- Nút Thêm báo cáo trực tiếp -->
        <button class="add-report-btn" id="openAddModalBtn" title="Thêm báo cáo mới vào thư viện">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>+ Thêm báo cáo</span>
        </button>

        <!-- Chế độ Tối / Sáng (Dark / Light Mode - BN-01) -->
        <button class="theme-toggle-btn" id="themeToggleBtn" title="Chuyển chế độ Sáng / Tối (Dark Mode)" aria-label="Chuyển chế độ sáng tối">
          <svg id="themeIconSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg id="themeIconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <!-- Trình giả lập trạng thái cho người chấm (FR-09) -->
        <div class="simulator-wrapper">
          <button class="sim-toggle-btn" id="simToggleBtn" title="Mô phỏng trạng thái đề bài FR-09">
            <span>🧪 Demo Lab</span>
            <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="sim-menu" id="simMenu">
            <label class="sim-item">
              <span>Độ trễ 1s (Loading Skeleton)</span>
              <input type="checkbox" id="simDelayCheck">
            </label>
            <label class="sim-item">
              <span>Mô phỏng lỗi mạng (Error API)</span>
              <input type="checkbox" id="simErrorCheck">
            </label>
            <div style="border-top:1px dashed var(--card-border); margin:4px 0;"></div>
            <button onclick="resetToDefaultData()" style="font-size:11.5px; color:#ef4444; text-align:left; font-weight:600; cursor:pointer;">🔄 Đặt lại 12 báo cáo gốc</button>
          </div>
        </div>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <main class="content-area" id="mainContent"></main>

  </div>

  <!-- MODAL THÊM BÁO CÁO MỚI (IN-APP ADD REPORT) -->
  <div class="modal-backdrop" id="addReportModal">
    <div class="modal-card">
      <div class="modal-header">
        <div style="display:flex; align-items:center; gap:8px;">
          <div class="modal-icon-badge" id="modalIconBadge">+</div>
          <h2 class="modal-title" id="modalFormTitle">Thêm Báo Cáo Mới</h2>

        <button class="modal-close-btn" id="closeAddModalBtn" aria-label="Đóng">&times;</button>
      </div>

      <form id="addReportForm" class="modal-form">
        <input type="hidden" id="formMode" value="create">
        <input type="hidden" id="editingReportId" value="">

        <div class="form-group">
          <label class="form-label">Tên báo cáo <span style="color:#ef4444;">*</span></label>
          <input type="text" id="newReportTitle" class="form-input" placeholder="Ví dụ: Báo cáo tuyển dụng nhân sự quý 4" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Nhóm phòng ban <span style="color:#ef4444;">*</span></label>
            <select id="newReportGroup" class="form-select" required>
              <!-- Sẽ được điền động qua JS -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Mã báo cáo</label>
            <input type="text" id="newReportId" class="form-input" placeholder="R13" required>
          </div>
        </div>

        <!-- Nhóm mới fields (khi chọn + Nhóm mới) -->
        <div id="customGroupFields" style="display:none;" class="form-row custom-group-box">
          <div class="form-group" style="flex:2;">
            <label class="form-label">Tên nhóm mới (Ví dụ: HR / Nhân sự)</label>
            <input type="text" id="customGroupName" class="form-input" placeholder="Nhập tên nhóm...">
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">Màu sắc</label>
            <input type="color" id="customGroupColor" class="form-color-picker" value="#8b5cf6">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Ngày cập nhật</label>
            <input type="text" id="newReportDate" class="form-input" placeholder="dd/mm/yyyy">
          </div>
          <div class="form-group">
            <label class="form-label">Kiểu khối màu (Seed)</label>
            <input type="number" id="newReportSeed" class="form-input" value="15" min="1" max="99">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Địa chỉ nhúng BI Dashboard</label>
          <input type="text" id="newReportEmbed" class="form-input" placeholder="https://bi.example.vn/embed/R13">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="cancelAddBtn">Hủy</button>
          <button type="submit" class="btn-submit" id="modalSubmitBtn">
            <span id="modalSubmitText">Lưu & Hiển thị ngay</span>
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ============================================================
       C. LOGIC JAVASCRIPT GỌN NHẸ & HIỆU NĂNG CAO
       ============================================================ -->
  <script>
    const APP_DATA = {{ initial_data | tojson | safe }};

    // Hợp nhất dữ liệu cấu hình gốc và dữ liệu thêm/sửa/xóa từ localStorage
    function loadMergedData() {
      let groups = [...(APP_DATA.groups || [])];
      let reports = [...(APP_DATA.reports || [])];

      try {
        const savedGroups = JSON.parse(localStorage.getItem('kpi_custom_groups') || '[]');
        savedGroups.forEach(sg => {
          if (!groups.some(g => g.id.toUpperCase() === sg.id.toUpperCase())) groups.push(sg);
        });

        const allReports = localStorage.getItem('kpi_all_reports');
        if (allReports) {
          reports = JSON.parse(allReports);
        } else {
          const savedReports = JSON.parse(localStorage.getItem('kpi_custom_reports') || '[]');
          savedReports.forEach(sr => {
            if (!reports.some(r => r.id.toUpperCase() === sr.id.toUpperCase())) reports.push(sr);
          });
        }
      } catch (e) {
        console.warn('Lỗi đọc localStorage:', e);
      }

      return { groups, reports };
    }

    function saveReportsToStorage() {
      try {
        localStorage.setItem('kpi_all_reports', JSON.stringify(state.reports));
      } catch (e) {
        console.warn('Lỗi lưu localStorage:', e);
      }
    }

    const initialMerged = loadMergedData();

    // -------------------------------------------------------------
    // 1. STATE MANAGEMENT TẬP TRUNG (EX-05)
    // -------------------------------------------------------------
    const state = {
      groups: initialMerged.groups,
      menus: APP_DATA.menus || [],
      reports: initialMerged.reports,
      
      currentPath: window.location.pathname || '/thu-vien-bao-cao',
      selectedGroup: null, 
      searchQuery: '',     
      viewMode: localStorage.getItem('kpi_view_mode') || 'grid',
      currentTheme: localStorage.getItem('kpi_theme') || 'light',
      sortBy: 'date-desc', // 'date-desc', 'date-asc', 'name-asc'
      userRole: 'ALL',     // 'ALL', 'TDS', 'SKR', 'ASC', 'TN' (Mock RBAC)
      
      // Trạng thái FR-09
      simulateDelay: false,
      simulateError: false,
      isLoading: false,
      hasError: false
    };

    // -------------------------------------------------------------
    // 2. UTILS: CHUẨN HÓA TIẾNG VIỆT & SINH ẢNH THUMBNAIL CAO CẤP
    // -------------------------------------------------------------
    function normalizeVietnamese(text) {
      if (!text) return '';
      return text
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[đĐ]/g, m => m === 'đ' ? 'd' : 'D')
        .toLowerCase()
        .trim();
    }

    function parseDate(dStr) {
      if (!dStr) return 0;
      const parts = dStr.split('/');
      if (parts.length === 3) {
        return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`).getTime();
      }
      return 0;
    }

    // Sinh đồ họa Abstract Data Art SVG dựa theo Seed & Color (FR-05)
    function generateThumbnailSvg(color, seed) {
      const s = Number(seed) || 1;
      const isDark = state.currentTheme === 'dark';
      const bg = isDark ? '#0b1329' : '#ffffff';
      const gridColor = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.03)';
      const pattern = s % 4;
      
      let shapes = '';
      if (pattern === 3 || pattern === 0) {
        // Kiểu 1: Mảng khối cân đối hiện đại (như thẻ R01)
        shapes = `
          <rect x="0" y="0" width="85" height="95" fill="${color}" opacity="0.95"/>
          <rect x="155" y="75" width="85" height="60" fill="${color}" opacity="0.9"/>
          <rect x="240" y="0" width="120" height="95" fill="${color}" opacity="0.95"/>
          <circle cx="210" cy="35" r="4" fill="${color}" opacity="0.5"/>
          <circle cx="120" cy="115" r="4" fill="${color}" opacity="0.5"/>
        `;
      } else if (pattern === 1) {
        // Kiểu 2: Dải khối góc và thanh ngang đáy (như thẻ R02)
        shapes = `
          <rect x="130" y="0" width="85" height="28" fill="${color}" opacity="0.95"/>
          <rect x="285" y="24" width="75" height="90" fill="${color}" opacity="0.95"/>
          <rect x="130" y="105" width="85" height="30" fill="${color}" opacity="0.95"/>
          <line x1="30" y1="40" x2="100" y2="40" stroke="${color}" stroke-width="3" stroke-dasharray="4" opacity="0.5"/>
          <line x1="30" y1="55" x2="80" y2="55" stroke="${color}" stroke-width="3" opacity="0.3"/>
        `;
      } else if (pattern === 2) {
        // Kiểu 3: Khối tâm điểm sắc nét (như thẻ R03)
        shapes = `
          <rect x="0" y="0" width="360" height="135" fill="${color}" opacity="0.92"/>
          <rect x="80" y="20" width="180" height="95" fill="${bg}" rx="3"/>
          <rect x="105" y="45" width="45" height="45" fill="${color}" opacity="0.25" rx="2"/>
          <circle cx="205" cy="65" r="14" fill="${color}" opacity="0.3"/>
        `;
      }

      return `
        <svg viewBox="0 0 360 135" width="100%" height="100%" preserveAspectRatio="none" style="display:block;">
          <rect width="360" height="135" fill="${bg}"/>
          <!-- Grid lines -->
          <line x1="0" y1="45" x2="360" y2="45" stroke="${gridColor}" stroke-width="1"/>
          <line x1="0" y1="90" x2="360" y2="90" stroke="${gridColor}" stroke-width="1"/>
          <line x1="120" y1="0" x2="120" y2="135" stroke="${gridColor}" stroke-width="1"/>
          <line x1="240" y1="0" x2="240" y2="135" stroke="${gridColor}" stroke-width="1"/>
          ${shapes}
        </svg>
      `;
    }

    function getMenuIconSvg(iconName) {
      switch (iconName) {
        case 'pie-chart':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83M22 12A10 10 0 0 0 12 2v10z"/></svg>`;
        case 'table':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/></svg>`;
        case 'scan':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2m-10 0H5a2 2 0 0 1-2-2v-2M8 12h8M12 8v8"/></svg>`;
        case 'id-badge':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h4"/></svg>`;
        case 'graduation-cap':
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5zM6 12v5c3 3 9 3 12 0v-5"/></svg>`;
        default:
          return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
      }
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = 'toast-message';
      toast.innerHTML = `<span>⚡</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // -------------------------------------------------------------
    // 3. LOGIC LỌC, PHÂN QUYỀN VÀ SẮP XẾP BÁO CÁO (EX-03, BN-01)
    // -------------------------------------------------------------
    function getFilteredAndSortedReports() {
      let list = [...state.reports];

      // 1. Phân quyền giả định (Mock Role Filter - BN-01)
      if (state.userRole !== 'ALL') {
        list = list.filter(r => r.group.toUpperCase() === state.userRole.toUpperCase());
      }

      // 2. Lọc theo nhãn nhóm người dùng chọn (FR-03)
      if (state.selectedGroup) {
        list = list.filter(r => r.group.toUpperCase() === state.selectedGroup.toUpperCase());
      }

      // 3. Tìm theo tên tiếng Việt không dấu (FR-06)
      if (state.searchQuery) {
        const q = normalizeVietnamese(state.searchQuery);
        list = list.filter(r => normalizeVietnamese(r.title).includes(q));
      }

      // 4. Sắp xếp (Sort - BN-01)
      if (state.sortBy === 'date-desc') {
        list.sort((a, b) => parseDate(b.updated_at) - parseDate(a.updated_at));
      } else if (state.sortBy === 'date-asc') {
        list.sort((a, b) => parseDate(a.updated_at) - parseDate(b.updated_at));
      } else if (state.sortBy === 'name-asc') {
        list.sort((a, b) => a.title.localeCompare(b.title, 'vi'));
      }

      return list;
    }

    // -------------------------------------------------------------
    // 4. RENDER GIAO DIỆN
    // -------------------------------------------------------------
    function renderSidebar() {
      const navList = document.getElementById('sidebarNav');
      if (!navList) return;

      navList.innerHTML = state.menus.map(item => {
        const isActive = state.currentPath.startsWith(item.path);
        return `
          <li class="nav-item ${isActive ? 'active' : ''}">
            <button onclick="navigate('${item.path}')">
              ${getMenuIconSvg(item.icon)}
              <span>${item.title}</span>
            </button>
          </li>
        `;
      }).join('');
    }

    function renderGroupTags() {
      const container = document.getElementById('groupTagsContainer');
      if (!container) return;

      container.innerHTML = state.groups.map(g => {
        const isSelected = state.selectedGroup === g.id;
        // Nếu userRole đang giới hạn nhóm khác thì làm mờ tag này
        const isRestricted = state.userRole !== 'ALL' && state.userRole !== g.id;
        const opacityStyle = isRestricted ? 'opacity: 0.35; pointer-events: none;' : '';

        return `
          <button class="tag-pill ${isSelected ? 'active' : ''}" 
                  data-group="${g.id}" 
                  style="${opacityStyle}"
                  onclick="toggleGroupFilter('${g.id}')">
            <svg fill="currentColor" viewBox="0 0 16 16"><path d="M2 2a1 1 0 0 1 1-1h4.586a1 1 0 0 1 .707.293l7 7a1 1 0 0 1 0 1.414l-4.586 4.586a1 1 0 0 1-1.414 0l-7-7A1 1 0 0 1 2 6.586V2zm3.5 4a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>
            <span>${g.name}</span>
          </button>
        `;
      }).join('');
    }

    function renderContent() {
      const content = document.getElementById('mainContent');
      if (!content) return;

      // 1. Loading Skeleton (FR-09)
      if (state.isLoading) {
        content.innerHTML = `
          <div class="reports-grid">
            ${Array(6).fill(0).map(() => `
              <div class="report-card" style="pointer-events:none;">
                <div class="card-thumbnail skeleton"></div>
                <div class="card-body">
                  <div class="skeleton" style="width: 50px; height: 16px; margin-bottom: 8px;"></div>
                  <div class="skeleton" style="width: 80%; height: 20px; margin-bottom: 12px;"></div>
                  <div class="skeleton" style="width: 40%; height: 14px;"></div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
        return;
      }

      // 2. Error State (FR-09)
      if (state.hasError) {
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon" style="color:#ef4444; background:#fef2f2;">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
            </div>
            <div class="state-title">Không thể tải dữ liệu báo cáo</div>
            <div class="state-desc">Đã xảy ra lỗi khi kết nối tới máy chủ API. Vui lòng bấm Thử lại để tải lại dữ liệu.</div>
            <button class="state-btn" onclick="retryFetchData()">Thử lại</button>
          </div>
        `;
        return;
      }

      // 3. Chi tiết báo cáo (/thu-vien-bao-cao/R01) (FR-08)
      const detailMatch = state.currentPath.match(/^\/thu-vien-bao-cao\/([^\/]+)$/);
      if (detailMatch) {
        renderDetailView(detailMatch[1]);
        return;
      }

      // 4. Các trang menu khác (FR-10)
      if (state.currentPath !== '/thu-vien-bao-cao' && state.currentPath !== '/') {
        const activeMenu = state.menus.find(m => m.path === state.currentPath);
        const title = activeMenu ? activeMenu.title : 'Trang nội bộ';
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon" style="color:var(--primary); background:var(--primary-light);">
              ${getMenuIconSvg(activeMenu ? activeMenu.icon : 'scan')}
            </div>
            <div class="state-title">${title}</div>
            <div class="state-desc">Phân hệ này đang trong lộ trình phát triển giai đoạn tiếp theo của Edufit.</div>
            <button class="state-btn" onclick="navigate('/thu-vien-bao-cao')">Quay lại Thư viện báo cáo</button>
          </div>
        `;
        return;
      }

      // 5. Danh sách báo cáo
      const filtered = getFilteredAndSortedReports();

      if (filtered.length === 0) {
        content.innerHTML = `
          <div class="state-box">
            <div class="state-icon">
              <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            <div class="state-title">Không tìm thấy báo cáo phù hợp</div>
            <div class="state-desc">Không có báo cáo nào khớp với từ khóa "<strong>${escapeHtml(state.searchQuery)}</strong>" hoặc quyền xem hiện tại.</div>
            <button class="state-btn" onclick="clearAllFilters()">Xóa bộ lọc & Đặt lại</button>
          </div>
        `;
        return;
      }

      let html = '';
      state.groups.forEach(group => {
        // Nếu role hạn chế nhóm khác thì bỏ qua
        if (state.userRole !== 'ALL' && state.userRole !== group.id) return;

        const groupReports = filtered.filter(r => r.group.toUpperCase() === group.id.toUpperCase());
        if (groupReports.length === 0) return;

        html += `
          <section class="group-section">
            <div class="group-header">
              <span class="group-dot" style="background-color: ${group.color}"></span>
              <h2 class="group-title">${group.name}</h2>
              <span class="group-badge">${groupReports.length} báo cáo</span>
            </div>
        `;

        if (state.viewMode === 'grid') {
          html += `<div class="reports-grid">`;
          groupReports.forEach(r => {
            html += `
              <div class="report-card" tabindex="0" role="button" onclick="openReportDetail('${r.id}')" onkeydown="handleCardKeydown(event, '${r.id}')">
                <div class="card-thumbnail">
                  ${generateThumbnailSvg(r.color, r.seed)}
                  <div class="card-quick-actions" onclick="event.stopPropagation()">
                    <button class="card-action-icon edit-icon" title="Chỉnh sửa báo cáo" onclick="openEditModal('${r.id}')">
                      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="card-action-icon delete-icon" title="Xóa báo cáo" onclick="deleteReport('${r.id}')">
                      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    </button>
                  </div>
                </div>
                <div class="card-body">
                  <span class="card-tag" style="background-color: ${r.color}15; color: ${r.color}">
                    ${r.group}
                  </span>
                  <h3 class="card-title">${r.title.toUpperCase()}</h3>
                  <div class="card-subtitle">
                    <span>Ấn để xem chi tiết báo cáo</span>
                    <span class="card-date">${r.updated_at}</span>
                  </div>
                </div>
              </div>
            `;
          });
          html += `</div>`;
        } else {
          html += `<div class="reports-list">`;
          groupReports.forEach(r => {
            html += `
